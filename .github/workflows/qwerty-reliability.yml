name: QWERTY reliability

on:
  pull_request:
    branches: [feat/2.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwerty-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typing:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install --deployment
      - name: Select an available iOS 26 phone simulator
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json, os, subprocess
          listing = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))
          candidates = [(runtime, device) for runtime, devices in listing["devices"].items()
                        if ".iOS-26-" in runtime for device in devices
                        if device["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("No supported iOS 26 phone simulator is installed")
          runtime, device = sorted(candidates, key=lambda pair: pair[0])[-1]
          print(runtime, device["name"], device["udid"])
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("NUMPAD_SIMULATOR_UDID=" + device["udid"] + "\n")
          if device["state"] != "Booted":
              subprocess.run(["xcrun", "simctl", "boot", device["udid"]], check=True)
          subprocess.run(["xcrun", "simctl", "bootstatus", device["udid"], "-b"], check=True)
          PY
      - name: Build app and extension; run typing regression tests
        run: |
          set -o pipefail
          # Simulator ad-hoc signing preserves the shared-container entitlements.
          # Disabling signing makes app and extension settings diverge at runtime.
          xcodebuild test -workspace NumPad.xcworkspace -scheme NumPad \
            -destination "platform=iOS Simulator,id=${NUMPAD_SIMULATOR_UDID}" \
            -resultBundlePath QwertyReliability.xcresult \
            -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- \
            -only-testing:NumPadTests/QwertyAutocorrectTests \
            -only-testing:NumPadTests/QwertyPunctuationRulesTests \
            -only-testing:NumPadTests/QwertyPersonalDictionaryTests \
            -only-testing:NumPadTests/TypingQualityCountersTests \
            -only-testing:NumPadTests/QwertyPersonalizationContextTests \
            -only-testing:NumPadTests/QwertyTouchPersonalizationTests \
            -only-testing:NumPadTests/KeyboardLocalStateStoreTests \
            -only-testing:NumPadTests/AppOfferPresentationTests \
            -only-testing:NumPadTests/NewBuyerUpsellTests \
            -only-testing:NumPadTests/SessionMilestoneTests \
            -only-testing:NumPadTests/OnboardingFlowTests \
            -only-testing:NumPadTests/ProductCatalogTests \
            -only-testing:NumPadUITests/QwertyRealisticTypingTests \
            | tee qwerty-build.log
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwerty-reliability-results
          path: |
            qwerty-build.log
            QwertyReliability.xcresult
          retention-days: 14
