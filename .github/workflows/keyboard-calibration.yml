name: Keyboard calibration

on:
  push:
    branches: [codex/keyboard-calibration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibration:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scheme: [NumPad, NumPad-PrivateSwipe]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install --deployment
      - name: Exercise distribution rejection cases
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Select simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          listing = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          candidates = [(runtime, device) for runtime, devices in listing["devices"].items()
                        if ".iOS-26-" in runtime for device in devices if device["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("No iOS 26 phone simulator")
          runtime, device = sorted(candidates, key=lambda pair: pair[0])[-1]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("NUMPAD_SIMULATOR_UDID=" + device["udid"] + "\n")
          PY
      - name: Build both targets and test calibration
        env:
          CALIBRATION_SCHEME: ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild test -workspace NumPad.xcworkspace -scheme "$CALIBRATION_SCHEME" \
            -destination "platform=iOS Simulator,id=${NUMPAD_SIMULATOR_UDID}" \
            -derivedDataPath CalibrationDerived -resultBundlePath Calibration.xcresult \
            -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- \
            -only-testing:NumPadTests/QwertyCalibrationTests \
            -only-testing:NumPadTests/QwertyCalibratedRoutingTests \
            -only-testing:NumPadTests/QwertySwipeCalibrationTests \
            -only-testing:NumPadTests/QwertyGatingTests \
            -only-testing:NumPadTests/QwertyAutocorrectTests \
            -only-testing:NumPadTests/QwertyTypoVariantsTests \
            -only-testing:NumPadTests/QwertyShiftMachineTests \
            -only-testing:NumPadTests/QwertyAutocapTests \
            -only-testing:NumPadTests/QwertyCorrectionConfidenceTests \
            -only-testing:NumPadTests/QwertyTouchRoutingTests \
            -only-testing:NumPadTests/QwertyKeyboardViewHitTestTests \
            -only-testing:NumPadTests/QwertyGlideCaptureTests \
            -only-testing:NumPadTests/QwertyGlideDecoderTests \
            -only-testing:NumPadTests/QwertyGlidePathTests \
            -only-testing:NumPadTests/QwertyGlideInsertionTests \
            | tee calibration-build.log
      - name: Build production Release and verify swipe exclusion
        if: matrix.scheme == 'NumPad'
        run: |
          set -o pipefail
          xcodebuild build -workspace NumPad.xcworkspace -scheme NumPad -configuration Release \
            -destination "generic/platform=iOS Simulator" -derivedDataPath ReleaseDerived \
            CODE_SIGN_IDENTITY=- | tee release-build.log
          python3 scripts/check_private_swipe.py --product ReleaseDerived/Build/Products/Release-iphonesimulator/NumPad.app
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: calibration-${{ matrix.scheme }}
          path: |
            calibration-build.log
            release-build.log
            Calibration.xcresult
          retention-days: 14
